<div class="auth-page">
  <header class="auth-header">
    <a routerLink="/" class="brand-logo" aria-label="DABubble Startseite">
      <img
        src="assets/icons/Logo.svg"
        alt="DABubble Logo"
        width="70"
        height="70"
        class="brand-logo__icon"
      />
      <img
        src="assets/icons/logo-name-black.svg"
        alt="DABubble"
        width="156"
        height="24"
        class="brand-logo__name"
      />
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card auth-card--wide" aria-labelledby="reset-heading">
      <a
        routerLink="/forgot-password"
        class="back-btn"
        aria-label="Zurück zu E-Mail eingeben"
      >
        <img
          src="assets/icons/arrow_back.svg"
          alt=""
          width="24"
          height="24"
          class="back-btn__icon"
        />
      </a>

      <div class="auth-card__head">
        <h1 id="reset-heading" class="auth-card__title">Passwort zurücksetzen</h1>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
        <div class="input-group">
          <label for="new-password" class="visually-hidden">Neues Passwort</label>
          <div
            class="input-pill"
            [class.input-pill--focused]="passwordFocused"
            [class.input-pill--error]="showPasswordError()"
          >
            <img
              [src]="getLockIcon(passwordFocused, password)"
              alt=""
              width="24"
              height="24"
              class="input-pill__icon"
            />
            <input
              type="password"
              id="new-password"
              name="newPassword"
              [(ngModel)]="password"
              (focus)="passwordFocused = true"
              (blur)="onPasswordBlur()"
              placeholder="Neues Passwort"
              autocomplete="new-password"
              enterkeyhint="next"
              minlength="8"
              required
              [attr.aria-invalid]="showPasswordError()"
              aria-describedby="new-password-error"
              class="input-pill__field"
            />
          </div>
          <p
            id="new-password-error"
            class="input-error"
            [class.input-error--visible]="showPasswordError()"
            aria-live="polite"
          >
            *Das Passwort muss mindestens 8 Zeichen lang sein.
          </p>
        </div>

        <div class="input-group">
          <label for="confirm-password" class="visually-hidden">Neues Passwort bestätigen</label>
          <div
            class="input-pill"
            [class.input-pill--focused]="confirmFocused"
            [class.input-pill--error]="showConfirmError()"
          >
            <img
              [src]="getLockIcon(confirmFocused, confirmPassword)"
              alt=""
              width="24"
              height="24"
              class="input-pill__icon"
            />
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              (focus)="confirmFocused = true"
              (blur)="onConfirmBlur()"
              placeholder="Neues Passwort bestätigen"
              autocomplete="new-password"
              enterkeyhint="done"
              minlength="8"
              required
              [attr.aria-invalid]="showConfirmError()"
              aria-describedby="confirm-password-error"
              class="input-pill__field"
            />
          </div>
          <p
            id="confirm-password-error"
            class="input-error"
            [class.input-error--visible]="showConfirmError()"
            aria-live="polite"
          >
            *Die Passwörter stimmen nicht überein.
          </p>
        </div>

        <div class="submit-row">
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!isFormValid() || isSubmitting"
          >
            Passwort ändern
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="auth-footer">
    <a routerLink="/imprint" class="footer-link">Impressum</a>
    <a routerLink="/privacy" class="footer-link">Datenschutz</a>
  </footer>
</div>

@if (showToast) {
  <div class="toast-backdrop" role="status" aria-live="polite">
    <div class="toast-pill">
      <span>Passwort geändert</span>
    </div>
  </div>
}
