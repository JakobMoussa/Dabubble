<div class="profile-overlay" (click)="closePopup()">

    <div class="profile-popup" role="dialog" aria-modal="true" aria-label="Profil" (click)="$event.stopPropagation()">

        @if (!isEditing) {

        <div class="profile-header">
            <h2>Profil</h2>
            <button type="button" (click)="closePopup()">✕</button>
        </div>

        <img class="profile-avatar" [src]="userAvatar" [alt]="userName" />

        <div class="profile-info">
            <div class="profile-name">
                <h3>{{ userName }}</h3>

                @if (canEdit) {
                <button type="button" (click)="startEditing()">
                    Bearbeiten
                </button>
                }
            </div>

            <p class="profile-status">🟢 Aktiv</p>

            <div class="profile-email">
                <strong>E-Mail-Adresse</strong>
                <p>fred.beck&#64;email.com</p>
            </div>
        </div>

        } @else {

        <div class="profile-header">
            <h2>Dein Profil bearbeiten</h2>
            <button type="button" (click)="closePopup()">✕</button>
        </div>

        <img class="profile-avatar" [src]="userAvatar" [alt]="userName" />

        <div class="edit-profile">
            <label for="profile-name">Vollständiger Name</label>

            <input id="profile-name" type="text" [(ngModel)]="editedName" />

            <div class="edit-profile-actions">
                <button type="button" (click)="cancelEditing()">
                    Abbrechen
                </button>

                <button type="button" (click)="saveProfile()">
                    Speichern
                </button>
            </div>
        </div>

        }

    </div>
</div>
