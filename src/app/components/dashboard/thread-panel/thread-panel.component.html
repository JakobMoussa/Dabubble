<aside class="thread-panel" aria-label="Thread Ansicht">
  <header class="thread-header">
    <div class="thread-header__title-group">
      <h2 class="thread-header__title">Thread</h2>
      <span class="thread-header__channel"># {{ channelName }}</span>
    </div>
    <button
      type="button"
      class="thread-close-btn"
      aria-label="Thread schließen"
      (click)="onClose()"
    >
      <img src="assets/icons/close.svg" alt="" width="14" height="14" />
    </button>
  </header>

  <div class="thread-messages">
    <app-chat-message [message]="rootMessage" [currentUid]="currentUid" [userNames]="userNames" [channelNames]="channelNames" [compact]="true"
      [showThreadLink]="false" (reactionToggled)="rootReaction.emit($event)" (mentionClicked)="mentionClicked.emit($event)" />

    <div class="thread-divider">
      <span class="thread-divider__count">{{ replyCount }} {{ replyCount === 1 ? 'Antwort' : 'Antworten' }}</span>
      <span class="thread-divider__line"></span>
    </div>

    @for (reply of replies; track reply.id) {
    <app-chat-message [message]="reply" [currentUid]="currentUid" [userNames]="userNames" [channelNames]="channelNames" [compact]="true"
      [showThreadLink]="false" (reactionToggled)="reactionToggled.emit($event)" (edited)="edited.emit($event)"
      (mentionClicked)="mentionClicked.emit($event)" />
    }
  </div>

  <div class="thread-composer-wrap">
    <app-message-composer inputId="thread-reply-input" placeholder="Antworten..." [members]="members"
      [channels]="channels" [compact]="true"
      [draftKey]="'thread:' + rootMessage.id" (sent)="replySent.emit($event)" />
  </div>
</aside>
