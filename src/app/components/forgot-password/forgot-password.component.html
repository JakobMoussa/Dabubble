<div class="auth-page">
  <header class="auth-header">
    <a routerLink="/" class="brand-logo" aria-label="DABubble Startseite">
      <img
        src="assets/icons/Logo.svg"
        alt="DABubble Logo"
        width="70"
        height="70"
        class="brand-logo__icon"
      />
      <img
        src="assets/icons/logo-name-black.svg"
        alt="DABubble"
        width="156"
        height="24"
        class="brand-logo__name"
      />
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card auth-card--wide" aria-labelledby="forgot-heading">
      <a
        routerLink="/login"
        class="back-btn"
        aria-label="Zurück zur Anmeldung"
      >
        <img
          src="assets/icons/arrow_back.svg"
          alt=""
          width="24"
          height="24"
          class="back-btn__icon"
        />
      </a>

      <div class="auth-card__head">
        <h1 id="forgot-heading" class="auth-card__title">Passwort zurücksetzen</h1>
        <p class="auth-card__subtitle">
          Bitte geben Sie Ihre E-Mail-Adresse ein.
        </p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
        <div class="input-group">
          <label for="reset-email" class="visually-hidden">E-Mail-Adresse</label>
          <div
            class="input-pill"
            [class.input-pill--focused]="emailFocused"
            [class.input-pill--error]="showEmailError()"
          >
            <img
              [src]="getMailIcon()"
              alt=""
              width="24"
              height="24"
              class="input-pill__icon"
            />
            <input
              type="email"
              id="reset-email"
              name="email"
              [(ngModel)]="email"
              (focus)="onEmailFocus()"
              (blur)="onEmailBlur()"
              (input)="onEmailInput()"
              placeholder="beispielname@email.com"
              autocomplete="email"
              enterkeyhint="done"
              required
              [attr.aria-invalid]="showEmailError()"
              aria-describedby="reset-email-error reset-email-hint"
              class="input-pill__field"
            />
          </div>
          <p
            id="reset-email-error"
            class="input-error"
            [class.input-error--visible]="showEmailError()"
            aria-live="polite"
          >
            *Diese E-Mail-Adresse ist leider ungültig.
          </p>
        </div>

        <p id="reset-email-hint" class="reset-info-text">
          Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
        </p>

        <div class="submit-row">
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!isEmailValid() || isSubmitting"
          >
            E-Mail senden
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="auth-footer">
    <a routerLink="/imprint" class="footer-link">Impressum</a>
    <a routerLink="/privacy" class="footer-link">Datenschutz</a>
  </footer>
</div>

@if (showToast) {
  <div class="toast-backdrop" role="status" aria-live="polite">
    <div class="toast-pill">
      <img
        src="assets/icons/send.svg"
        alt=""
        width="32"
        height="32"
        class="toast-pill__icon"
      />
      <span>E-Mail gesendet</span>
    </div>
  </div>
}
