<div class="profile-overlay" (click)="closePopup()">

    <div class="profile-popup" role="dialog" aria-modal="true" aria-label="Profil" (click)="$event.stopPropagation()">

        <div class="profile-header">
            <h2>Profil</h2>

            <button type="button" (click)="closePopup()">
                ✕
            </button>
        </div>

        <img class="profile-avatar" [src]="userAvatar" [alt]="userName" />

        <div class="profile-info">
            <div class="profile-name">
                <h3>{{ userName }}</h3>
                <button type="button">Bearbeiten</button>
            </div>

            <p class="profile-status"><img src="/assets/icons/activ.svg" alt="activ" width="16" height="16"> Aktiv</p>

            <div class="profile-email">
                <strong>E-Mail-Adresse</strong>
                <p>fred.beck&#64;email.com</p>
            </div>
        </div>

    </div>
</div>
